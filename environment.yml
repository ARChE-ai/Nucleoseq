# Verified end-to-end on arche011314 (conda 25.1.1) on 2026-08-19: `conda env create
# -f environment.yml` succeeds, `conda activate nucleoseq` + TF/GPU import works
# (libcudart.so.11.0 loads, TF 2.5.0), all core + notebook-stack imports succeed,
# and `pip check` reports no broken requirements. Two fixes were needed to get here:
#   - added conda-forge (defaults no longer carries cudatoolkit=11.2)
#   - removed dash + its dependency chain (Flask, Werkzeug, blinker, click,
#     itsdangerous, plotly, plotly-resampler, narwhals, orjson, retrying,
#     tsdownsample) - confirmed unused by grepping src/*.py and every notebook;
#     it conflicted with the pinned typing-extensions==3.7.4.3 (needed for TF 2.5)
